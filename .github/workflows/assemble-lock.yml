name: assemble-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/mayck-lighthouse-perf-32c7]
    paths: ['.github/workflows/assemble-lock.yml', 'package.json']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Generate lockfile and commit
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install
          wc -c pnpm-lock.yaml
          grep -c fontsource pnpm-lock.yaml
          grep -q '@fontsource-variable/outfit' pnpm-lock.yaml
          git config user.name "Thiago Albuquerque de Paula"
          git config user.email "62264928+thiago-tap@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix(mayck): lockfile completo com fontsource."
          git push
