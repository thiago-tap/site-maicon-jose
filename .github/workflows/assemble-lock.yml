name: assemble-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/mayck-lighthouse-perf-32c7]
    paths: ['.lock-parts/**', '.github/workflows/assemble-lock.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o pnpm-lock.yaml \
            "https://raw.githubusercontent.com/thiago-tap/plataforma-fotografos/45c7863/docs/clientes/_artifacts/maicon-jose-pnpm-lock.yaml"
          wc -c pnpm-lock.yaml
          grep -c fontsource pnpm-lock.yaml
          grep -q '@fontsource-variable/outfit' pnpm-lock.yaml
          git config user.name "Thiago Albuquerque de Paula"
          git config user.email "62264928+thiago-tap@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix(mayck): lockfile completo com fontsource."
          git push
