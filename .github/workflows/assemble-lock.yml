name: Assemble pnpm-lock

on:
  push:
    paths:
      - 'lock-parts/**'
      - '.github/workflows/assemble-lock.yml'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and write pnpm-lock.yaml
        env:
          LOCK_URL: 'https://raw.githubusercontent.com/thiago-tap/plataforma-fotografos/main/.tmp-maicon-jose-pnpm-lock.yaml?token=BRK5HRPDHLJJ3SUR5CGMMGTK5SUGJAVPNFXHG5DBNRWGC5DJN5XF62LE2MAAAAAE477VNUFRNFXHG5DBNRWGC5DJN5XF65DZOBS32U3DN5YGKZCJNZ2GKZ3SMF2GS33OJFXHG5DBNRWGC5DJN5XA'
        run: |
          set -euo pipefail
          curl -fsSL "$LOCK_URL" -o pnpm-lock.yaml
          python3 <<'PY2'
          import hashlib
          from pathlib import Path
          raw = Path('pnpm-lock.yaml').read_bytes()
          got = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 97308, len(raw)
          assert got == '2884ea96e6ab0320655c9da53f8043bc3018d5fe0efeda9da00fc249d82de69f', got
          print('ok', len(raw), got)
          PY2
      - name: Commit lockfile and cleanup
        run: |
          set -euo pipefail
          rm -rf lock-parts
          rm -f .github/workflows/assemble-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Replace placeholder with real pnpm-lock.yaml"
          git push
